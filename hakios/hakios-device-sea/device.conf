# devices/sea/device.conf: what this device repository is (docs/porting/repositories.md has every word).
# Status = what was seen on the phone (Redmi Note 12S, MT6781, 8 GiB RAM, MediaTek LK "kaeru"), by the ios-sea port.

device sea
	title       Redmi Note 12S
	vendor      Xiaomi
	soc         mt6781
	defconfig   sea_defconfig
	maintainer  GabrielM700 (ios-sea)
	status      cpu         works     8 cores by PSCI CPU_ON (6x Cortex-A55, 2x Cortex-A76), GICv3, 13 MHz timer; no cpufreq
	status      storage     partial   UFS 2.2 woken by the shim (and by uefi-sea's SeaUfsDxe, read-only block device) (START STOP UNIT on the W-LUN), XNU's UFS driver finds `userdata` on LUN 2, read only; the root runs from RAM
	status      usb         partial   the shim's (and uefi-sea's SeaLoaderDxe) own fastboot-like gadget (MUSB 0x11200000, forced VBUS in the PHY, ~6 MB/s PIO): download, `oem addr`, `oem go`; no XNU USB driver
	status      display     partial   LK's framebuffer (1080x2400, pitch 4320, 0x7c606000) shown as the console; AppleCLCD + IOSurface present it, no panel driver
	status      thermal     missing   not started
	status      touch       missing   FocalTech FTS on I2C0 (0x11007000, address 0x38), not started
	status      buttons     missing   not started
	status      gpu         missing   Mali-G57 (Bifrost/Valhall): nothing to port from the Adreno work
	status      wifi        missing   not started
	status      cellular    missing   not started
	status      battery     missing   not started
